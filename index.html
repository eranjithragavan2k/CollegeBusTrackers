
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #e8eaf6);
        }

        .main-container {
            width: 90%;
            max-width: 800px;
            padding: 40px 25px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1a237e;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            margin-bottom: 35px;
        }

        .container-wrapper {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .login-container {
            flex: 1;
            min-width: 220px;
            padding: 30px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            background: #fafafa;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        .login-container h2 {
            margin-bottom: 12px;
            color: #263238;
        }

        .login-container p {
            color: #666;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .login-button {
            display: inline-block;
            width: 100%;
            padding: 13px 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .user-button {
            background: #1976d2;
        }

        .user-button:hover {
            background: #0d47a1;
        }

        .driver-button {
            background: #2e7d32;
        }

        .driver-button:hover {
            background: #1b5e20;
        }

        @media (max-width: 550px) {
            .main-container {
                padding: 30px 18px;
            }

            .container-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">

        <h1>College Bus System</h1>
        <p class="description">
            Welcome! Select your account type to continue.
        </p>

        <div class="container-wrapper">

            <!-- User Container -->
            <div class="login-container">
                <h2>User</h2>
                <p>Access the user home page to continue.</p>

                <a href="./UserHome.html"
                   class="login-button user-button">
                    User
                </a>
            </div>

            <!-- Driver Container -->
            <div class="login-container">
                <h2>Driver</h2>
                <p>Access the driver home page to continue.</p>

                <a href="./DriverHome.html"
                   class="login-button driver-button">
                    Driver
                </a>
            </div>

        </div>
    </div>

</body>
</html>

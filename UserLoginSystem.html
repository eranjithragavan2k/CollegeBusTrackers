<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; frame-ancestors 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <link rel="stylesheet" href="UserLoginSystemStyle.css">
    <title>Login System</title>
</head>
<body>
    <div class="container">
        <div class="outer">
            <div class="btn">
                <button class="signIn active">Sign In</button>
                <button class="signUp">Sign Up</button>
            </div>
            <div class="forms">
                <div class="sign-in">
                    <div class="head">
                        <h1>Welcome Back</h1>
                        <h4>Sign in to continue to your journey</h4>
                    </div>
                    <form id="loginForm">
                        <label for="login-email">Email</label><br><br>
                        <input type="email" id="login-email" class="inputs" name="email" placeholder="Enter Your Email" required><br><br>
                        <label for="login-password">Password</label><br><br>
                        <div class="password-field">
                            <input type="password" id="login-password" class="inputs" name="password" placeholder="Enter Your Password" required>
                            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                                <svg class="eye-icon eye-slash" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                                <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.2 17.2 0 0 1-3.1 3.8M6.1 6.1C3.5 7.8 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                            </button>
                        </div>
                        <div class="forgot-password">
                            <a href="ForgotPassword.html">Forgot Password?</a>
                        </div><br>
                        <button type="submit">Sign In</button><br><br>
                    </form>
                </div>

                <div class="sign-up">
                    <div class="head">
                        <h1>Create Account</h1>
                        <h4>Join us to start your journey</h4>
                    </div>
                    <form id="registerForm">
                        <div class="form-step active" id="stage1">
                            <label for="Name">Full Name</label><br><br>
                            <input type="text" id="register-name" class="inputs" name="name" placeholder="Enter Your Full Name" required><br><br>
                            <label for="Email">Email</label><br><br>
                            <input type="email" id="register-email" class="inputs" name="email" placeholder="Enter Your Email" required><br><br>
                            <label for="Id">ID</label><br><br>
                            <input type="text" id="register-id" class="inputs" name="Id" placeholder="Enter Your ID" required><br><br>
                            <div class="stage-controls">
                                <button class="next-btn" type="button">Next</button>
                            </div>
                        </div>
                        <div class="form-step" id="stage2">
                            <label for="register-password">Password</label><br><br>
                            <div class="password-field">
                                <input type="password" id="register-password" class="inputs" name="password" placeholder="Enter a Password" required>
                                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                                    <svg class="eye-icon eye-slash" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                                    <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.2 17.2 0 0 1-3.1 3.8M6.1 6.1C3.5 7.8 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                                </button>
                            </div><br><br>
                            <label for="confirm-password">Confirm Password</label><br><br>
                            <div class="password-field">
                                <input type="password" id="confirm-password" class="inputs" name="confirm-password" placeholder="Confirm Password" required>
                                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                                    <svg class="eye-icon eye-slash" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                                    <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.2 17.2 0 0 1-3.1 3.8M6.1 6.1C3.5 7.8 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
                                </button>
                            </div><br><br>
                            <div class="stage-controls">
                                <button class="previous-btn" type="button">Previous</button>
                                <button class="register-submit" type="submit">Sign Up</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
